[package]
name = "mihon-clone"
version = "0.1.0"
description = "A desktop manga reader inspired by Mihon."
authors = ["mihon-clone contributors"]
edition = "2021"

[lib]
name = "mihon_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
